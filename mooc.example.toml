# Copy to mooc.toml (or set MOOC_CONFIG) to customize.

[opend]
host = "127.0.0.1"
port = 11111

[trading]
# Policy: this client is SIMULATE-only. REAL is intentionally not enabled.
default_trd_env = "SIMULATE"
allowed_trd_envs = ["SIMULATE"]
default_currency = "USD"

[ui]
market = "US"
# Default self-selected group shown in the TUI. Empty = first custom group.
default_group = ""

[storage]
# SQLite database path. Defaults to <MOOC_RUNTIME_DIR>/mooc.db (~/.mooc/mooc.db).
# path = "~/.mooc/mooc.db"

[rules]
# Directory (or file) of strategy rule YAML files (spec ch. 14).
# path = "rules"

[data_quality]
# A quote older than these thresholds is flagged stale (chapter 18 leaves the
# exact values open; these are conservative defaults).
realtime_max_age_sec = 60
delayed_max_age_sec = 900
