[project]
name = "mooc"
version = "0.1.0"
description = "US options data + trading client (pure options, daemon-mediated)"
requires-python = ">=3.11"
dependencies = [
    "moomoo-api>=10.12.7208",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = ["textual>=0.70"]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[project.scripts]
mooc = "mooc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mooc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a running OpenD"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["moomoo", "moomoo.*", "yaml"]
ignore_missing_imports = true
